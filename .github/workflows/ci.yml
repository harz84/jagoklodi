# Pemeriksaan otomatis untuk setiap pull request dan setiap perubahan di main dan rilis.
# Build (pemeriksaan konten, skema, kuis, tautan) lalu uji di browser desktop dan HP.
name: CI

on:
  pull_request:
  push:
    branches: [main, rilis]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dan-uji:
    name: Build dan uji
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Build dan pemeriksaan konten
        run: npm run build

      - name: Pasang browser untuk uji
        run: npx playwright install --with-deps chromium

      - name: Uji di browser (desktop dan HP)
        run: npm test

      # Uji login memakai Supabase tiruan; tidak ada data sungguhan yang dikirim.
      - name: Build dengan login aktif (nilai uji)
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: https://uji.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_uji

      - name: Uji login dan sinkron progres
        run: npx playwright test tests/login.spec.ts --project=desktop

      - name: Simpan laporan bila uji gagal
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hasil-uji
          path: test-results/
          retention-days: 7
