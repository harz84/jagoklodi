# Dependabot memeriksa versi baru paket dan membuka pull request otomatis ke main.
# Pembaruan digabung per ekosistem supaya tidak banjir PR dan notifikasi.
# Pembaruan keamanan tetap datang sebagai PR terpisah secepatnya; setelah di-merge,
# segera rilis (lihat docs/rilis.md), jangan tunggu jadwal rilis mingguan.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      paket-minor-dan-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      semua-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
