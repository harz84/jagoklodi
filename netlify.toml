[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Header keamanan untuk semua halaman.
# Penjelasan tiap header ada di docs/keamanan.md.
[[headers]]
  for = "/*"
  [headers.values]
    # Paksa HTTPS selama 1 tahun (browser mengingatnya).
    Strict-Transport-Security = "max-age=31536000"
    # Jangan izinkan situs ini dimuat di dalam situs lain (mencegah clickjacking).
    X-Frame-Options = "DENY"
    # Browser tidak boleh menebak-nebak jenis file.
    X-Content-Type-Options = "nosniff"
    # Saat pengunjung mengklik tautan keluar, kirim domain saja, bukan alamat lengkap.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Situs ini tidak butuh kamera, mikrofon, lokasi, dan sejenisnya.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Content Security Policy: hanya muat skrip, style, gambar, dan font dari domain sendiri.
    # 'unsafe-inline' masih dibutuhkan oleh skrip dan style inline bawaan Starlight;
    # 'wasm-unsafe-eval' dibutuhkan mesin pencarian Pagefind.
    # connect-src *.supabase.co dibutuhkan untuk login dan sinkron progres.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
